[project]
name = "prompt-eval-toolkit"
version = "0.1.0"
description = "A/B test your prompts before merging them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["llm", "prompts", "evaluation", "ab-test", "llm-judge", "regression-testing"]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/prompt-eval-toolkit"
Issues = "https://github.com/darrshangovender/prompt-eval-toolkit/issues"

[project.scripts]
prompt-eval = "prompt_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution name ("prompt-eval-toolkit") does not match the import
# package directory ("prompt_eval/"), so hatchling cannot infer what to ship
# and aborts the build. Naming it explicitly keeps `pip install -e .` working.
[tool.hatch.build.targets.wheel]
packages = ["prompt_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
